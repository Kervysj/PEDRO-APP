<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#1a3a6b"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Cotizador PLF Soluciones de Gas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css"/>
<link rel="manifest" href="manifest.json"/>
<style>
/* ── RESET ─────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#eef1f8;min-height:100vh;font-size:16px;color:#1a2340;
}

/* ── LAYOUT ─────────────────────────────── */
.app{max-width:780px;margin:0 auto;padding:16px}

/* ── TABS ───────────────────────────────── */
.tabs{
  display:flex;background:#fff;border-radius:14px;
  box-shadow:0 2px 10px rgba(26,58,107,.09);
  margin-bottom:16px;overflow:hidden;
}
.tab{
  flex:1;padding:14px 8px;font-size:14px;font-weight:700;
  cursor:pointer;border:none;background:none;color:#9aaac8;
  font-family:inherit;transition:all .18s;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab.active{
  color:#fff;background:#1a3a6b;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.1);
}
.tab i{font-size:16px}
.panel{display:none}.panel.active{display:block}

/* ── CARDS ──────────────────────────────── */
.card{
  background:#fff;border-radius:16px;
  padding:18px;margin-bottom:14px;
  box-shadow:0 2px 12px rgba(26,58,107,.08);
  border:1px solid #e4eaf5;
}

/* ── ENCABEZADO LOGO ────────────────────── */
.logo-header{
  display:flex;align-items:center;gap:14px;
  margin-bottom:14px;padding-bottom:14px;
  border-bottom:1.5px solid #eef1f8;
}
.logo-real{width:90px;height:auto;object-fit:contain;flex-shrink:0;border-radius:8px}
.company-info{flex:1;min-width:0}
.company-info h2{font-size:13px;font-weight:800;color:#1a3a6b;margin-bottom:3px;line-height:1.3;letter-spacing:.01em}
.company-info p{font-size:10.5px;color:#8a9abf;line-height:1.7}
.cot-meta{text-align:right;font-size:10.5px;color:#8a9abf;flex-shrink:0}
.cot-meta strong{color:#1a3a6b;font-weight:800;display:block;font-size:12px}

/* ── TÍTULOS DE SECCIÓN ─────────────────── */
.section-title{
  font-size:10px;font-weight:800;color:#b0bdd8;
  text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:12px;margin-top:2px;
  display:flex;align-items:center;gap:7px;
}
.section-title::after{
  content:'';flex:1;height:1px;background:#eef1f8;
}

/* ── FORMULARIOS ────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-size:11px;color:#8a9abf;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
}
.field input,.field select{
  width:100%;padding:12px 14px;font-size:15px;
  border:1.5px solid #dce4f0;border-radius:10px;
  background:#f8faff;color:#1a2340;font-family:inherit;
  direction:ltr;text-align:left;unicode-bidi:normal;
  -webkit-appearance:none;appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus{
  outline:none;border-color:#1a3a6b;
  background:#fff;box-shadow:0 0 0 4px rgba(26,58,107,.09);
}
.field input::placeholder{color:#c8d2e8}

/* ── VALIDEZ ────────────────────────────── */
.validez-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.validez-row label{font-size:11px;color:#8a9abf;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.validez-row input{
  width:72px;padding:11px 12px;font-size:15px;
  border:1.5px solid #dce4f0;border-radius:10px;
  font-family:inherit;color:#1a2340;background:#f8faff;
  direction:ltr;text-align:center;-webkit-appearance:none;
}
.validez-row select{
  padding:11px 12px;font-size:14px;
  border:1.5px solid #dce4f0;border-radius:10px;
  font-family:inherit;color:#1a2340;background:#f8faff;
  -webkit-appearance:none;
}

/* ── TABLA ÍTEMS escritorio ─────────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;border-radius:10px}
.items-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.items-table th{
  background:#1a3a6b;color:#fff;
  padding:10px 8px;text-align:left;
  font-weight:700;font-size:11px;white-space:nowrap;
  letter-spacing:.04em;text-transform:uppercase;
}
.items-table th:first-child{border-radius:10px 0 0 0}
.items-table th:last-child{border-radius:0 10px 0 0}
.items-table td{padding:8px 4px;border-bottom:1px solid #eef1f8;vertical-align:middle}
.items-table tr:last-child td{border-bottom:none}
.items-table td textarea,
.items-table td input{
  border:1.5px solid #dce4f0;border-radius:8px;
  padding:7px 9px;font-size:14px;
  font-family:inherit;background:#f8faff;color:#1a2340;
  width:100%;
  direction:ltr !important;text-align:left !important;
  unicode-bidi:normal !important;writing-mode:horizontal-tb !important;
  -webkit-appearance:none;appearance:none;-webkit-text-size-adjust:100%;
}
.items-table td textarea {
  resize: vertical;
  min-height: 60px;
  height: 60px;
}
.items-table td input:focus,
.items-table td textarea:focus{outline:none;border-color:#1a3a6b;background:#fff}
.col-num{width:32px;text-align:center;color:#e87b2a;font-weight:800;font-size:13px}
.col-unid{width:82px}
.col-cant{width:68px}
.col-precio{width:100px}
.col-sub{width:108px;text-align:right;font-weight:800;color:#1a3a6b;padding-right:8px;white-space:nowrap;font-size:13px}
.col-del{width:36px;text-align:center}
.del-btn{
  background:none;border:none;cursor:pointer;
  color:#e87b2a;font-size:18px;
  padding:5px 7px;border-radius:8px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.del-btn:active{background:#fff3ec}

/* ── TARJETAS ÍTEMS móvil ───────────────── */
.item-card{
  background:#f8faff;border:1.5px solid #e4eaf5;
  border-radius:14px;padding:14px;margin-bottom:10px;
}
.item-card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.item-card-num{
  width:28px;height:28px;border-radius:50%;
  background:#1a3a6b;color:#fff;
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.item-card-sub{
  font-weight:800;color:#1a3a6b;font-size:16px;
  background:#e8f0fb;padding:3px 10px;border-radius:20px;
}
.item-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item-card-field{display:flex;flex-direction:column;gap:4px}
.item-card-field label{
  font-size:10px;color:#8a9abf;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;
}
.item-card-field input{
  border:1.5px solid #dce4f0;border-radius:9px;
  padding:10px 12px;font-size:15px;
  font-family:inherit;background:#fff;color:#1a2340;
  width:100%;
  direction:ltr !important;text-align:left !important;
  unicode-bidi:normal !important;writing-mode:horizontal-tb !important;
  -webkit-appearance:none;-webkit-text-size-adjust:100%;
}
.item-card-field input:focus{outline:none;border-color:#1a3a6b;box-shadow:0 0 0 3px rgba(26,58,107,.09)}
.item-card-desc{margin-bottom:8px}
.item-card-desc textarea,
.item-card-desc input{
  border:1.5px solid #dce4f0;border-radius:9px;
  padding:11px 12px;font-size:15px;
  font-family:inherit;background:#fff;color:#1a2340;
  width:100%;direction:ltr !important;text-align:left !important;
  -webkit-appearance:none;
}
.item-card-desc textarea {
  resize: vertical;
  min-height: 70px;
  height: 70px;
}
.item-card-desc input::placeholder,
.item-card-desc textarea::placeholder{color:#c8d2e8}
.item-card-desc input:focus,
.item-card-desc textarea:focus{outline:none;border-color:#1a3a6b}

/* ── AGREGAR ÍTEM ───────────────────────── */
.add-btn{
  margin-top:12px;padding:13px 16px;font-size:14px;
  border:2px dashed #c8d2e8;border-radius:12px;
  background:none;color:#8a9abf;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  gap:8px;font-family:inherit;font-weight:700;width:100%;
  transition:all .15s;
}
.add-btn:active,.add-btn:hover{background:#f0f3fa;border-color:#1a3a6b;color:#1a3a6b}

/* ── TOTALES ────────────────────────────── */
.totals{
  text-align:right;margin-top:14px;padding:14px 0 0;
  border-top:2px solid #eef1f8;
}
.total-final{
  font-size:26px;font-weight:800;color:#1a3a6b;
  letter-spacing:-.01em;
}
.nota-pie{
  font-size:10.5px;color:#b0bdd8;font-style:italic;
  padding:12px 0 2px;border-top:1px solid #eef1f8;
  margin-top:12px;line-height:1.8;
}
.nota-pie strong{font-style:normal;color:#1a3a6b;font-weight:700}

/* ── FIRMA ──────────────────────────────── */
.firma-row{display:flex;justify-content:flex-end;padding-top:28px;margin-top:8px;border-top:1px solid #eef1f8}
.firma-box{text-align:center;width:200px}
.firma-box .linea{border-top:1.5px solid #b0bdd8;margin-bottom:5px}
.firma-box p{font-size:10.5px;color:#b0bdd8}

/* ── BOTONES ACCIÓN ─────────────────────── */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{
  padding:15px 12px;font-size:14px;font-weight:700;
  border-radius:12px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  gap:8px;border:none;
  transition:transform .1s,opacity .15s,box-shadow .15s;
  text-align:center;line-height:1.2;-webkit-appearance:none;
  letter-spacing:.01em;
}
.btn:active{opacity:.82;transform:scale(.98)}
.btn i{font-size:17px}
.btn-primary{background:#1a3a6b;color:#fff;box-shadow:0 3px 10px rgba(26,58,107,.28)}
.btn-wa{background:#22c35e;color:#fff;box-shadow:0 3px 10px rgba(34,195,94,.28)}
.btn-mail{background:#fff;color:#1a2340;border:1.5px solid #dce4f0;box-shadow:0 2px 6px rgba(26,58,107,.07)}
.btn-save{background:#e87b2a;color:#fff;box-shadow:0 3px 10px rgba(232,123,42,.28)}
.btn-pdf{background:#e74c3c;color:#fff;box-shadow:0 3px 10px rgba(231,76,60,.28)}
.btn-full{grid-column:1/-1}

/* ── HISTORIAL ──────────────────────────── */
.hist-item{
  background:#fff;border:1px solid #e4eaf5;border-radius:14px;
  padding:14px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(26,58,107,.05);
}
.hist-info h4{font-size:14px;font-weight:800;color:#1a2340}
.hist-info p{font-size:12px;color:#8a9abf;margin-top:3px;line-height:1.5}
.hist-actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
.btn-sm{
  padding:9px 14px;font-size:12px;border-radius:9px;
  cursor:pointer;font-family:inherit;border:none;
  display:flex;align-items:center;gap:5px;font-weight:700;
}
.btn-sm-blue{background:#1a3a6b;color:#fff}
.btn-sm-red{background:#fff0f0;color:#c0392b;border:1px solid #f0c0c0}
.badge-dias{
  font-size:10px;padding:3px 9px;border-radius:20px;
  background:#e8f0fb;color:#1a3a6b;margin-left:5px;font-weight:800;
}
.empty-state{
  text-align:center;padding:3rem 1rem;color:#b0bdd8;font-size:14px;
}
.empty-state i{font-size:3rem;display:block;margin-bottom:12px;opacity:.5}

/* ── BANNER OFFLINE ─────────────────────── */
.offline-banner{
  display:none;background:#e6f9ee;color:#1d6e3e;
  font-size:12px;padding:8px 14px;border-radius:10px;
  margin-bottom:12px;align-items:center;gap:7px;font-weight:600;
}

/* ── TOAST ──────────────────────────────── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:#1a3a6b;color:#fff;padding:12px 24px;
  border-radius:40px;font-size:14px;font-weight:700;
  z-index:9999;display:none;
  box-shadow:0 6px 24px rgba(26,58,107,.32);
  max-width:88vw;text-align:center;
  white-space:nowrap;
}

/* ── MODAL WHATSAPP ─────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.52);
  z-index:10000;display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
.modal-box{
  background:#fff;border-radius:22px 22px 0 0;
  padding:28px 24px 32px;width:100%;max-width:480px;
  box-shadow:0 -8px 40px rgba(0,0,0,.18);text-align:center;
}
.modal-box .modal-icon{font-size:2.8rem;margin-bottom:10px;display:block}
.modal-box h3{font-size:17px;font-weight:800;color:#1a2340;margin-bottom:8px}
.modal-box p{font-size:13px;color:#8a9abf;margin-bottom:6px;line-height:1.7}
.modal-box p strong{color:#1a3a6b}
.modal-steps{
  background:#f0f4fb;border-radius:12px;padding:14px 16px;
  text-align:left;margin:14px 0;font-size:13px;
  color:#3a4a6a;line-height:2;
}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;padding:14px 8px;font-size:14px}

/* ── BANNER INSTALACIÓN PWA ─────────────── */
.install-banner{
  display:none;background:#fff8e6;color:#8f6b00;border:1.5px solid #ffeeba;
  font-size:13px;padding:10px 14px;border-radius:12px;
  margin-bottom:14px;align-items:center;justify-content:space-between;font-weight:700;
}
.install-banner button{
  background:#e87b2a;color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;
}

/* ── RESPONSIVO MÓVIL ───────────────────── */
@media(max-width:600px){
  .app{padding:10px}
  .card{padding:14px;border-radius:14px}
  .logo-header{flex-wrap:wrap;gap:10px}
  .logo-real{width:72px}
  .cot-meta{
    min-width:100%;text-align:left;
    display:grid;grid-template-columns:1fr 1fr;gap:4px;
  }
  .cot-meta p{font-size:10px}
  .cot-meta strong{font-size:11px}
  .form-grid{grid-template-columns:1fr}
  .table-wrap{display:none}
  .items-cards{display:block}
  .total-final{font-size:28px}
  .action-row{grid-template-columns:1fr;gap:10px}
  .btn-full{grid-column:auto}
  .btn{padding:16px 14px;font-size:15px}
  .modal-overlay{align-items:flex-end}
  .modal-box{border-radius:22px 22px 0 0}
  .firma-row{display:none}
  .toast{bottom:16px;font-size:13px;padding:11px 20px}
}
@media(min-width:601px){
  .items-cards{display:none}
}
</style>
</head>

  <div id="install-banner" class="install-banner">
    <span><i class="ti ti-device-mobile-plus"></i> Instala esta app en tu dispositivo</span>

    <button class="tab" onclick="cambiarPestaña('historial')"><i class="ti ti-history"></i> Historial <span id="hist-count-badge"></span></button>
